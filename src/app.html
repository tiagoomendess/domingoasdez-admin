<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="%theme.class%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="light dark" />
		<script nonce="%sveltekit.nonce%">
			// Resolve the theme before first paint (no flash). Keep in sync with src/lib/theme.ts.
			(function () {
				var saved = document.cookie.match(/(?:^|; )theme=(light|dark)/);
				var dark = saved
					? saved[1] === 'dark'
					: window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-gray-50 text-gray-900 antialiased dark:bg-gray-900 dark:text-gray-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
