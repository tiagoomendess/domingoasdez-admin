# nginx site for the admin, based on domingoasdez-app/nginx.conf.
# Install as /etc/nginx/sites-available/admin.domingoasdez.com and symlink it into sites-enabled.
# Before the first `nginx -t`: create /var/log/nginx/admin.domingoasdez.com/ and issue the
# certificate with certbot (webroot /var/www/html).
#
# Must match the app's .env: PORT=3004 (proxy_pass), BODY_SIZE_LIMIT (client_max_body_size),
# PROTOCOL_HEADER=x-forwarded-proto and ADDRESS_HEADER=CF-Connecting-IP (proxy headers below).

server {
    listen 80;
    server_name admin.domingoasdez.com;

    server_tokens off;

    # Serve ACME challenge files from the correct base webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.domingoasdez.com;

    server_tokens off;

    # The app sets these on the pages it renders (src/hooks.server.ts), but not on the static
    # files adapter-node serves. Hide the app's copies and set them here so every response gets
    # exactly one value. Keep them in sync with hooks.server.ts; CSP stays in the app (vite.config.ts).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Robots-Tag;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Same as BODY_SIZE_LIMIT in .env (uploads). Raise both together.
    client_max_body_size 25M;

    # Serve ACME challenge files from the correct base webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Image processing and CSV imports can take a while on large uploads.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Logging
    access_log /var/log/nginx/admin.domingoasdez.com/access.log;
    error_log /var/log/nginx/admin.domingoasdez.com/error.log;

    ssl_certificate /etc/letsencrypt/live/admin.domingoasdez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.domingoasdez.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
}
